<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 证件管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>body { background: #f5f7fa; }</style>
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h4 class="text-center mb-3"><i class="bi bi-folder-check text-primary"></i> 证件管理系统</h4>
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
              {% endfor %}
            {% endwith %}
            <form method="post">
              <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" autofocus required>
              </div>
              <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">登录</button>
            </form>
            <p class="text-muted small text-center mt-3 mb-0">默认账号 admin / admin123，请登录后修改密码</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
