{% extends "base.html" %}
{% block title %}{{ '编辑商品' if p else '新建商品' }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header bg-light"><i class="bi bi-box-seam"></i> {{ '编辑商品' if p else '新建商品' }}</div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">厂家 <span class="text-danger">*</span></label>
            <select name="manufacturer_id" class="form-select" required>
              {% for m in manufacturers %}
                <option value="{{ m.id }}" {{ 'selected' if p and p.manufacturer_id == m.id else '' }}>{{ m.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">商品名称 <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" value="{{ p.name if p else '' }}" required>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">类别</label>
              <input type="text" name="category" class="form-control" list="category-list" value="{{ p.category if p and p.category else '' }}">
              <datalist id="category-list"></datalist>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">规格</label>
              <input type="text" name="spec" class="form-control" value="{{ p.spec if p and p.spec else '' }}">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">保质期（天）</label>
              <input type="number" name="shelf_life_days" class="form-control" min="1" value="{{ p.shelf_life_days if p and p.shelf_life_days else '' }}" placeholder="如 365 表示一年，5 表示 5 天">
              <div class="form-text">用于厂检报告有效期计算</div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">备注</label>
            <textarea name="remark" class="form-control" rows="2">{{ p.remark if p and p.remark else '' }}</textarea>
          </div>
          <button class="btn btn-primary">保存</button>
          {% if p %}
            <a href="{{ url_for('product.detail', product_id=p.id) }}" class="btn btn-link">返回详情</a>
          {% else %}
            <a href="{{ url_for('product.list_products') }}" class="btn btn-link">返回列表</a>
          {% endif %}
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
